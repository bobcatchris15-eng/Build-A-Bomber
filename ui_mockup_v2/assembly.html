<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembly Bay - Build-A-Bomber</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="assembly-body">
    <div class="bg-layer" style="background-image: url('bg.jpg');"></div>
    
    <!-- Cartoonish Unit sitting in realistic hangar -->
    <div class="unit-layer interactive" id="canvas-unit">
        <img src="unit_tank.jpg" alt="Tank Ballista" class="unit-sprite">
        
        <!-- Mockup Grab Handles -->
        <div class="grab-handle x-axis" style="top: 40%; left: 60%;"></div>
        <div class="grab-handle y-axis" style="top: 30%; left: 50%;"></div>
        <div class="grab-handle rotate-ring" style="top: 50%; left: 50%;"></div>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- TOP LEFT: Admin Island -->
        <div class="island admin-island textured-panel">
            <a href="index.html" class="icon-btn" title="Back to Menu">◂ MENU</a>
            <div class="island-divider"></div>
            <button class="icon-btn" title="Save Blueprint">SAVE</button>
            <button class="icon-btn" title="Load Blueprint">LOAD</button>
            <div class="island-divider"></div>
            <button class="icon-btn" title="Undo">↩</button>
            <button class="icon-btn" title="Redo">↪</button>
            <button class="icon-btn symmetry-toggle" onclick="this.classList.toggle('off')">SYM</button>
        </div>

        <!-- TOP RIGHT: Retractable Stat Block -->
        <div class="island stat-island textured-panel" id="stat-block">
            <div class="stat-header" onclick="document.getElementById('stat-block').classList.toggle('expanded')">
                <span class="stat-title">MODEL SPECIFICATIONS</span>
                <span class="expand-icon">▼</span>
            </div>
            <div class="stat-content">
                <div class="stat-row"><span class="lbl">MASS</span> <span class="val txt-yellow">450g</span></div>
                <div class="stat-row"><span class="lbl">STRUCTURAL INTEGRITY</span> <span class="val txt-green">HIGH</span></div>
                <div class="stat-row"><span class="lbl">PLASTIC COST</span> <span class="val txt-yellow">18 SPRUES</span></div>
                
                <div class="expanded-only">
                    <hr class="dim-line">
                    <div class="stat-row"><span class="lbl">FIREPOWER (1:35)</span> <span class="val txt-red">3,200</span></div>
                    <div class="stat-row"><span class="lbl">MOTOR SPEED</span> <span class="val txt-blue">9V DC</span></div>
                    <div class="stat-row"><span class="lbl">PAINT FINISH</span> <span class="val txt-green">MATTE</span></div>
                </div>
            </div>
        </div>

        <!-- BOTTOM CENTER: Floating Parts Dock -->
        <div class="island parts-dock textured-panel">
            <div class="dock-tabs">
                <button class="dock-tab active" onclick="switchDockTab(this, 'hulls')">HULLS</button>
                <button class="dock-tab" onclick="switchDockTab(this, 'weapons')">WEAPONS</button>
                <button class="dock-tab" onclick="switchDockTab(this, 'locomotion')">LOCOMOTION</button>
                <button class="dock-tab" onclick="switchDockTab(this, 'support')">SUPPORT</button>
            </div>
            
            <div class="dock-drawer" id="dock-drawer">
                <input type="text" class="dock-search" placeholder="Search catalog...">
                <div class="parts-grid">
                    <div class="part-card">
                        <span class="part-weight">1.2 T</span>
                        <div class="part-name">Ballista Core</div>
                    </div>
                    <div class="part-card">
                        <span class="part-weight">0.8 T</span>
                        <div class="part-name">Auto-Loader</div>
                    </div>
                    <div class="part-card">
                        <span class="part-weight">2.5 T</span>
                        <div class="part-name">Heavy Plating</div>
                    </div>
                    <div class="part-card">
                        <span class="part-weight">4.0 T</span>
                        <div class="part-name">Siege Engine</div>
                    </div>
                    <div class="part-card heavy">
                        <span class="part-weight">12.0 T</span>
                        <div class="part-name">Democracy Cannon</div>
                    </div>
                    <div class="part-card">
                        <span class="part-weight">0.5 T</span>
                        <div class="part-name">Sensors</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- RADIAL MENU (Hidden by default) -->
    <div class="radial-menu" id="radial-menu">
        <div class="radial-center"></div>
        <button class="radial-item r-top" title="Properties">⚙️</button>
        <button class="radial-item r-right danger" title="Delete">🗑️</button>
        <button class="radial-item r-bottom" title="Duplicate">📑</button>
        <button class="radial-item r-left" title="Paint/Material">🎨</button>
        
        <div class="radial-info textured-panel">
            <div class="r-title">Ballista Turret</div>
            <div class="r-arc txt-red">ARC BLOCKED (15°)</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
